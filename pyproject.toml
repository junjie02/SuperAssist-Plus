[project]
name = "superassist"
version = "0.1.0"
description = "LangChain/LangGraph assistant with CogniFold-style typed-graph memory and ACP team agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.4.0",
    "ddgs>=9.14.4,<10.0.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "filelock>=3.15.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "lightrag-hku>=1.5.4,<2.0.0",
    "lark-oapi>=1.4.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "openai>=2.0.0",
    "pillow>=10.4.0,<13.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=6.1.0,<7.0.0",
    "pymysql>=1.1.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.7.0",
    "typing-extensions>=4.12.0",
    "uvicorn>=0.30.0",
    "wecom-aibot-python-sdk==1.0.2",
    "pywinauto>=0.6.9,<0.7.0; sys_platform == 'win32'",
    "rapidocr-onnxruntime>=1.4.4,<2.0.0; sys_platform == 'win32'",
    "redis>=5.2.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
superassist = "superassist.cli:main"
superassist-feishu = "superassist.channels.feishu:main"
superassist-wecom = "superassist.channels.wecom:main"
superassist-wecom-rpa = "superassist.channels.wecom_rpa:main"
superassist-memory-ui = "superassist.ui.server:main"
superassist-ai-engine = "superassist.ui.server:serve_main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
